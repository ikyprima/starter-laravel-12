services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekap-pajak-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - VITE_PORT=5174
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_rekap_pajak}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    networks:
      - rekap-pajak-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: rekap-pajak-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:

      MYSQL_DATABASE: ${DB_DATABASE:-db_rekap_pajak}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - rekap-pajak-db-data:/var/lib/mysql
    networks:
      - rekap-pajak-net

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekap-pajak-vite
    command: npm run dev
    volumes:
      - .:/app
    ports:
      - "5174:5173"
    networks:
      - rekap-pajak-net
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rekap-pajak-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
    networks:
      - rekap-pajak-net
    depends_on:
      - db

networks:

  rekap-pajak-net:
    driver: bridge

volumes:
  rekap-pajak-db-data:
