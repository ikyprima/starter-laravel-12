services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: rekap-pajak-prod
    restart: always
    ports:
      - "8087:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8087}
      - APP_FORCE_HTTPS=${APP_FORCE_HTTPS:-false}
      - KEYCLOAK_REDIRECT_URI=http://localhost:8087/auth/sso/callback
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_rekap_pajak}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SIPD_BASE_URL=${SIPD_BASE_URL}
      - SIPD_CLIENT_ID=${SIPD_CLIENT_ID}
      - SIPD_CLIENT_SECRET=${SIPD_CLIENT_SECRET}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-false}
    networks:
      - rekap-pajak-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: rekap-pajak-db-prod
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_rekap_pajak}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3308:3306"
    volumes:
      - rekap-pajak-db-prod-data:/var/lib/mysql
    networks:
      - rekap-pajak-net

networks:
  rekap-pajak-net:
    driver: bridge

volumes:
  rekap-pajak-db-prod-data:
